apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet

metadata:
  name: applications
  namespace: argocd

spec:
  goTemplate: true
  generators:
    - git:
        repoURL: https://github.com/Namilaus/argocd_platform.git
        revision: HEAD

        directories:
          - path: apps/*

  template:
    metadata:
      name: "{{ .path.basename }}"

    spec:
      project: default

      source:
        repoURL: https://github.com/Namilaus/argocd_platform.git
        targetRevision: HEAD
        path: "{{ .path.path }}"

      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .path.basename }}"

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
