apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
spec:
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
    spec:
      containers:
        - name: hermes
          image: nousresearch/hermes-agent:latest
          args:
            - gateway
            - run
          env:
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_HOST
              value: "127.0.0.1"
          ports:
            - name: http
              containerPort: 9119
