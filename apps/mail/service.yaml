apiVersion: v1
kind: Service
metadata:
  name: stalwart-service
  argocd.argoproj.io/sync-wave: "1"
spec:
  type: LoadBalancer
  selector:
    app: stalwart
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: smtps
      port: 465
      targetPort: smtps
    - name: imaps
      port: 993
      targetPort: imaps
