apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: mail-update-strategy
  namespace: argocd
spec:
  writeBackConfig:
    method: "git:secret:argocd/github-creds"
    gitConfig:
      repository: "https://github.com/Namilaus/argocd_platform"
      branch: "main"
  applicationRefs:
    - namePattern: "mail"
      images:
        - alias: "stalwart"
          imageName: "stalwartlabs/stalwart"
          commonUpdateSettings:
            updateStrategy: "semver"
