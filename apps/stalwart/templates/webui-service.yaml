apiVersion: v1
kind: Service
metadata:
  name: {{ include "stalwart.fullname" . }}-web
  labels:
    {{- include "stalwart.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "stalwart.selectorLabels" . | nindent 4 }}
  ports:
    - name: mgmt
      port: 8080
      targetPort: mgmt
    - name: http
      port: 80
      targetPort: http
    - name: https
      port: 443
      targetPort: https
      