apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: httproute
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - host:
        - web.atayi.net
      secretName: web-tls
  rules:
    - host: web.atayi.net
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: webservice
                port:
                  number: 8085
