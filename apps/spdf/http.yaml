apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: http-route
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    argocd.argoproj.io/sync-wave: "1"
    app.kubernetes.io/name: http-route
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - pdf.atayi.net
      secretName: spdf-secret
  rules:
    - host: pdf.atayi.net
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: spdf-service
                port:
                  name: http
