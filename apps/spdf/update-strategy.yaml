apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: pdf-tools-update-strategy
  namespace: argocd
spec:
  writeBackConfig:
    method: "git:secret:argocd/github-creds"
    gitConfig:
      repository: "https://github.com/Namilaus/argocd_platform"
      branch: "main"
  applicationRefs:
    - namePattern: "spdf"
      images:
        - alias: "spdf"
          imageName: "stirlingtools/stirling-pdf"
          commonUpdateSettings:
            updateStrategy: "semver"
